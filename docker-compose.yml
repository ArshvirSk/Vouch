version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vouch-postgres
    environment:
      POSTGRES_USER: vouch
      POSTGRES_PASSWORD: vouch_dev_password
      POSTGRES_DB: vouch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vouch-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
